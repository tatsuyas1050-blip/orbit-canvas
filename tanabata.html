<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>七夕 · 星に願いを</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-0:#05061a; --night-1:#0b1038; --night-2:#141a52;
    --milky:#b9c6ff; --star:#eaf0ff; --gold:#ffe6a3;
    --ink:#f3f6ff; --line:rgba(160,175,255,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  html{background:#141a52;}   /* セーフエリア/上部の白抜け対策（紺で塗る） */
  body{
    font-family:"Zen Maru Gothic",sans-serif;
    background:radial-gradient(140% 100% at 50% 0%, var(--night-2) 0%, var(--night-1) 42%, var(--night-0) 100%);
    color:var(--ink); overflow:hidden; position:fixed; inset:0; touch-action:manipulation;
  }

  /* ---------- sky & atmosphere ---------- */
  #sky{position:fixed;inset:0;z-index:0;display:block;}
  .milkyway{position:fixed;z-index:0;pointer-events:none;left:48%;top:34%;
    width:240vmax;height:36vmax;transform:translate(-50%,-50%) rotate(36deg);
    background:
      radial-gradient(30% 58% at 26% 50%, rgba(206,216,255,.13), transparent 70%),
      radial-gradient(26% 52% at 50% 50%, rgba(228,214,255,.16), transparent 72%),
      radial-gradient(30% 56% at 74% 50%, rgba(202,214,255,.12), transparent 70%),
      linear-gradient(to bottom, transparent 22%, rgba(200,212,255,.08) 42%, rgba(216,222,255,.14) 50%, rgba(200,212,255,.07) 58%, transparent 78%);
    filter:blur(9px);opacity:.8;mix-blend-mode:screen;}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(135% 72% at 50% 110%, rgba(3,4,18,.62), transparent 60%);}
  .firefly{position:fixed;z-index:2;width:4px;height:4px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff3c4,rgba(255,220,130,.15));
    filter:drop-shadow(0 0 6px rgba(255,214,130,.85));
    animation:drift var(--fd,13s) ease-in-out infinite alternate, glow var(--fg,3.4s) ease-in-out infinite;}
  @keyframes drift{from{transform:translate(0,0);}to{transform:translate(var(--fx,20px),var(--fy,-26px));}}
  @keyframes glow{0%,100%{opacity:.12;}50%{opacity:.65;}}

  /* ---------- home link ---------- */
  .home-link{position:fixed;z-index:8;top:calc(env(safe-area-inset-top) + 12px);left:12px;
    display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;text-decoration:none;
    color:rgba(224,232,255,.78);font-family:"Zen Maru Gothic",sans-serif;font-size:12px;letter-spacing:.08em;
    background:rgba(10,14,45,.42);border:1px solid rgba(150,165,255,.18);backdrop-filter:blur(4px);
    transition:color .15s ease,background .15s ease;}
  .home-link:hover{color:#eaf0ff;}
  .home-link:active{background:rgba(40,48,110,.6);}

  /* ---------- meeting animation motes ---------- */
  .mote{position:fixed;z-index:5;width:11px;height:11px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);will-change:transform,opacity;}
  .mote.ori{background:radial-gradient(circle,#fff,#ffd0e6);box-shadow:0 0 13px 4px rgba(255,190,220,.85);}
  .mote.hiko{background:radial-gradient(circle,#fff,#bcd4ff);box-shadow:0 0 13px 4px rgba(170,200,255,.85);}
  .bloom{position:fixed;z-index:5;width:16px;height:16px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
    background:radial-gradient(circle,#fff7d8,rgba(255,230,163,0));box-shadow:0 0 22px 9px rgba(255,235,180,.8);}
  .spark{position:fixed;z-index:5;width:4px;height:4px;border-radius:50%;background:#fff3c4;pointer-events:none;
    box-shadow:0 0 6px 2px rgba(255,230,160,.8);transform:translate(-50%,-50%);}
  .caption{position:fixed;z-index:9;left:50%;top:19%;transform:translateX(-50%);
    font-family:"Shippori Mincho B1",serif;font-size:13px;letter-spacing:.18em;color:#eaf0ff;text-align:center;
    text-shadow:0 1px 14px rgba(120,140,255,.7);opacity:0;transition:opacity .6s ease;pointer-events:none;white-space:nowrap;}
  .caption.on{opacity:1;}

  /* ---------- edge nav triangles ---------- */
  .edge{position:fixed;top:50%;transform:translateY(-50%);z-index:7;width:52px;height:88px;
    display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;
    color:rgba(224,232,255,.6);font-size:26px;line-height:1;transition:color .15s,opacity .25s;}
  .edge::before{content:"";position:absolute;inset:16px 8px;border-radius:40px;background:rgba(10,14,45,.32);
    border:1px solid rgba(150,165,255,.14);backdrop-filter:blur(3px);z-index:-1;}
  .edge:hover{color:rgba(235,240,255,.95);}
  .edge:active{transform:translateY(-50%) scale(.9);}
  .edge-l{left:2px;} .edge-r{right:2px;}
  .edge[hidden]{display:none;}

  /* ---------- stage / carousel ---------- */
  #stage-wrap{position:fixed;inset:0;z-index:3;overflow:hidden;}
  #track{position:absolute;inset:0;display:flex;width:calc(100% * var(--n,1));height:100%;will-change:transform;}
  .panel{flex:0 0 calc(100% / var(--n,1));height:100%;display:flex;align-items:center;justify-content:center;}
  .column{position:relative;height:94svh;height:94vh;aspect-ratio:100/166;max-width:96vw;container-type:size;}
  .bamboo{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .bamboo.mirror{transform:scaleX(-1);transform-origin:center;}
  .tz-layer{position:absolute;inset:0;}

  /* ---------- tanzaku ---------- */
  .hang{position:absolute;z-index:4;transform-origin:top center;
    animation:sway var(--dur,5s) ease-in-out infinite alternate;animation-delay:var(--del,0s);cursor:pointer;will-change:transform;}
  @keyframes sway{from{transform:rotate(var(--a,-2.4deg));}to{transform:rotate(calc(var(--a,-2.4deg) * -1));}}
  .thread{width:1px;height:5cqh;margin:0 auto;background:linear-gradient(var(--gold),rgba(255,230,163,.25));}
  .knot{width:4cqw;height:4cqw;max-width:11px;max-height:11px;border-radius:50%;margin:-2cqw auto 0;
    background:radial-gradient(circle at 35% 30%,#fff6d8,var(--gold));box-shadow:0 0 5px rgba(255,230,163,.7);}
  .tanzaku{width:14cqw;min-height:26cqh;margin:-1cqw auto 0;padding:3cqh 0;border-radius:2px;
    writing-mode:vertical-rl;text-orientation:upright;display:flex;justify-content:center;align-items:flex-start;
    font-family:"Klee One",serif;font-weight:600;font-size:4.1cqw;line-height:1.5;letter-spacing:.04em;
    box-shadow:0 3cqh 4cqh -2cqh rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0,rgba(0,0,0,.025) 1px,transparent 1px,transparent 7px);
    transition:transform .18s ease;max-height:52cqh;overflow:hidden;position:relative;}
  .tanzaku::after{content:"";position:absolute;top:2cqh;left:50%;transform:translateX(-50%);width:2.4cqw;height:2.4cqw;max-width:7px;max-height:7px;border-radius:50%;border:1px solid rgba(0,0,0,.18);}
  .hang:active .tanzaku{transform:scale(1.06);}
  .c-aka{background-color:#f7cccb;color:#7a2b2b;}
  .c-ki{background-color:#f6e6a5;color:#6f5a18;}
  .c-midori{background-color:#cbe8cd;color:#2c5732;}
  .c-murasaki{background-color:#ddd2f1;color:#432f66;}
  .c-shiro{background-color:#f6f1e4;color:#4a4038;}

  .empty{position:absolute;z-index:4;left:50%;top:58%;transform:translate(-50%,-50%);
    width:72%;max-width:250px;text-align:center;font-size:13px;line-height:2;color:#c3ccf0;
    background:rgba(10,14,45,.4);border:1px solid var(--line);border-radius:16px;padding:18px 18px;backdrop-filter:blur(2px);}
  .empty .ico{font-size:20px;display:block;margin-bottom:6px;opacity:.8;}

  /* ---------- hint toast ---------- */
  .hint{position:fixed;z-index:9;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%) translateY(6px);
    background:rgba(10,14,45,.66);border:1px solid var(--line);border-radius:14px;
    padding:9px 15px;font-size:12px;letter-spacing:.03em;color:#d3dbf6;text-align:center;max-width:82vw;line-height:1.7;
    backdrop-filter:blur(5px);opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none;}
  .hint.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- write button ---------- */
  #open-write{position:fixed;z-index:7;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 22px);border:none;cursor:pointer;
    font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;letter-spacing:.1em;color:#3a2e12;
    padding:14px 30px;border-radius:999px;background:linear-gradient(180deg,#fff0c6,#ffd873);
    box-shadow:0 10px 30px -8px rgba(255,200,90,.55),0 0 0 1px rgba(255,255,255,.45) inset;transition:transform .15s ease,box-shadow .15s ease;}
  #open-write:hover{box-shadow:0 12px 34px -8px rgba(255,200,90,.7),0 0 0 1px rgba(255,255,255,.5) inset;}
  #open-write:active{transform:translateX(-50%) scale(.95);}
  #open-write .star{margin-right:8px;}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(3,4,18,.62);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;}
  .scrim.on{opacity:1;pointer-events:auto;}
  #sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;background:linear-gradient(180deg,#171c4a,#0d1236);
    border-radius:24px 24px 0 0;border-top:1px solid var(--line);
    padding:8px 22px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.25,1);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.7);max-width:520px;margin:0 auto;max-height:92svh;overflow-y:auto;}
  #sheet.on{transform:translateY(0);}
  .grip{width:44px;height:4px;border-radius:99px;background:rgba(170,185,255,.4);margin:8px auto 14px;}
  #sheet h2{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:17px;letter-spacing:.14em;margin:0 0 4px;text-align:center;color:#eef1ff;}
  .target-hint{text-align:center;font-size:11px;letter-spacing:.06em;color:#9aa6dd;margin:0 0 12px;}
  .pv-wrap{display:flex;justify-content:center;margin:0 0 16px;}
  .pv-strip{writing-mode:vertical-rl;text-orientation:upright;font-family:"Klee One",serif;font-weight:600;
    width:32px;min-height:100px;max-height:124px;padding:11px 0;border-radius:3px;display:flex;justify-content:center;align-items:flex-start;
    font-size:13px;line-height:1.55;letter-spacing:.03em;overflow:hidden;position:relative;
    box-shadow:0 10px 22px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.35);transition:background-color .2s ease,color .2s ease;}
  .pv-strip::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;border:1px solid rgba(0,0,0,.2);}
  .pv-text.placeholder{opacity:.4;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;letter-spacing:.1em;color:#aab4e6;margin-bottom:7px;}
  .field-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .field-head label{margin-bottom:0;}
  .counter{font-size:11px;letter-spacing:.06em;color:#9aa6dd;font-variant-numeric:tabular-nums;transition:color .15s ease;}
  .counter.warn{color:#ffd873;}   /* 残りわずか */
  .counter.max{color:#ff9db0;}    /* 上限に到達 */
  textarea,input[type=text]{width:100%;font-family:"Klee One",serif;font-size:16px;color:#0e1230;
    background:#f5f3ea;border:none;border-radius:12px;padding:13px 14px;resize:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  textarea{min-height:84px;line-height:1.6;}
  textarea:focus,input:focus{outline:2px solid #ffd873;}
  .colors{display:flex;gap:12px;}
  .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s ease,border-color .12s ease;}
  .swatch[aria-checked=true]{border-color:#ffe6a3;transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,230,163,.28);}
  .sw-aka{background:#f7cccb;}.sw-ki{background:#f6e6a5;}.sw-midori{background:#cbe8cd;}.sw-murasaki{background:#ddd2f1;}.sw-shiro{background:#f6f1e4;}
  .sheet-actions{display:flex;gap:12px;margin-top:18px;}
  .btn{flex:1;border:none;cursor:pointer;font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;letter-spacing:.08em;padding:14px;border-radius:13px;transition:transform .12s ease,opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{color:#3a2e12;background:linear-gradient(180deg,#fff0c6,#ffd873);}
  .btn-primary:disabled{opacity:.42;cursor:default;}
  .btn-ghost{color:#c3ccf2;background:rgba(150,165,255,.12);}

  /* ---------- reader ---------- */
  #reader{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;}
  #reader.on{opacity:1;pointer-events:auto;}
  #reader .rback{position:absolute;inset:0;background:rgba(3,4,18,.72);backdrop-filter:blur(4px);}
  .read-card{position:relative;z-index:1;transform:scale(.85);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 24px;max-height:88vh;}
  #reader.on .read-card{transform:scale(1);}
  .read-close{position:absolute;top:-6px;right:14px;z-index:3;width:36px;height:36px;border-radius:50%;
    background:rgba(20,26,74,.72);border:1px solid var(--line);color:#dbe4ff;font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .read-close:active{background:rgba(40,48,110,.9);}
  .big-tanzaku{writing-mode:vertical-rl;text-orientation:upright;font-family:"Klee One",serif;font-weight:600;
    font-size:22px;line-height:1.85;letter-spacing:.06em;padding:34px 20px 30px;border-radius:5px;min-height:230px;max-height:60vh;overflow:auto;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.4);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 10px);position:relative;}
  .big-tanzaku::after{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(0,0,0,.2);}
  .seal{width:32px;height:32px;border-radius:50%;border:1.6px solid rgba(196,74,74,.6);color:rgba(210,90,90,.85);
    font-family:"Shippori Mincho B1",serif;font-size:15px;display:flex;align-items:center;justify-content:center;
    background:rgba(196,74,74,.08);box-shadow:0 0 0 3px rgba(196,74,74,.06);}
  .read-meta{text-align:center;color:#c9d2f5;font-size:12px;letter-spacing:.1em;line-height:1.9;}
  .read-meta .who{font-family:"Shippori Mincho B1",serif;font-size:14px;color:#eef1ff;}
  .read-hint{font-size:10px;color:#7c88c2;letter-spacing:.08em;}

  /* ---------- shooting star ---------- */
  .shoot{position:fixed;z-index:2;height:2px;width:120px;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
    filter:drop-shadow(0 0 6px #cfe0ff);border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    .hang{animation:none !important;}
    #track{transition:none !important;}
    .firefly{animation:none !important;opacity:.4;}
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="milkyway"></div>
  <div id="vignette"></div>
  <div class="caption" id="caption"></div>

  <a href="index.html" class="home-link" aria-label="ホームにもどる">‹ もどる</a>

  <button class="edge edge-l" id="prev" aria-label="前の竹" hidden>◀</button>
  <button class="edge edge-r" id="next" aria-label="次の竹" hidden>▶</button>

  <div id="stage-wrap">
    <div id="track"></div>
  </div>

  <div class="hint" id="hint"></div>

  <button id="open-write"><span class="star">✦</span>願いを書く</button>

  <div class="scrim" id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="短冊に願いを書く">
    <div class="grip"></div>
    <h2>短冊に願いを書く</h2>
    <p class="target-hint" id="target-hint"></p>
    <div class="pv-wrap">
      <div class="pv-strip c-midori" id="pv-strip"><span class="pv-text placeholder" id="pv-text">ねがいごと</span></div>
    </div>
    <div class="field">
      <div class="field-head">
        <label for="wish">願い事</label>
        <span class="counter" id="wish-count">0 / 40</span>
      </div>
      <textarea id="wish" maxlength="40" placeholder="叶えたい願い事を書いてください"></textarea>
    </div>
    <div class="field">
      <label for="who">お名前（任意）</label>
      <input type="text" id="who" maxlength="16" placeholder="よみ人しらず">
    </div>
    <div class="field">
      <label>短冊の色</label>
      <div class="colors" id="colors" role="radiogroup">
        <div class="swatch sw-aka" data-c="aka" role="radio" tabindex="0" aria-checked="false" aria-label="赤"></div>
        <div class="swatch sw-ki" data-c="ki" role="radio" tabindex="0" aria-checked="false" aria-label="黄"></div>
        <div class="swatch sw-midori" data-c="midori" role="radio" tabindex="0" aria-checked="true" aria-label="緑"></div>
        <div class="swatch sw-murasaki" data-c="murasaki" role="radio" tabindex="0" aria-checked="false" aria-label="紫"></div>
        <div class="swatch sw-shiro" data-c="shiro" role="radio" tabindex="0" aria-checked="false" aria-label="白"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancel">とじる</button>
      <button class="btn btn-primary" id="submit" disabled>笹にかける</button>
    </div>
  </div>

  <div id="reader" role="dialog" aria-modal="true">
    <div class="rback" id="rback"></div>
    <div class="read-card">
      <button class="read-close" id="read-close" aria-label="とじる">×</button>
      <div class="big-tanzaku" id="read-text"></div>
      <div class="seal" aria-hidden="true">星</div>
      <div class="read-meta">
        <div class="who" id="read-who"></div>
        <div id="read-date"></div>
        <div class="read-hint">背景をタップでとじる</div>
      </div>
    </div>
  </div>

<script>
"use strict";
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* persistence: localStorage-backed window.storage shim (async get/set API) */
if(!window.storage){
  window.storage={
    get:async(k)=>{try{const v=localStorage.getItem(k);return v==null?null:{value:v};}catch(e){return null;}},
    set:async(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}
  };
}

/* ---------- みんなで共有する短冊API ----------
   backend/tanabata-wishes をデプロイし、出力 WishApiUrl を下に貼り付けると
   「みんなで共有」モードになります（全員の短冊が同じ竹に並ぶ）。
   空 "" のままなら、この端末だけの保存(localStorage)で動きます。 */
const WISHES_API="https://7g2sgevhy5tzhawmtp4gshcvmu0ejdex.lambda-url.ap-northeast-1.on.aws/";
const SHARED=/^https?:\/\//.test(WISHES_API);
const CACHE="tanabata:cache";   /* 共有モードのオフライン用キャッシュ */

/* Milky Way axis (matches .milkyway rotation) */
const MW_ANGLE=36;

/* fireflies */
if(!reduceMotion){
  for(let i=0;i<5;i++){
    const f=document.createElement("div");f.className="firefly";
    f.style.left=(10+Math.random()*80)+"%";f.style.top=(45+Math.random()*45)+"%";
    f.style.setProperty("--fd",(10+Math.random()*8).toFixed(1)+"s");
    f.style.setProperty("--fg",(2.8+Math.random()*2).toFixed(1)+"s");
    f.style.setProperty("--fx",((Math.random()*2-1)*40).toFixed(0)+"px");
    f.style.setProperty("--fy",(-20-Math.random()*30).toFixed(0)+"px");
    f.style.animationDelay=(-Math.random()*8).toFixed(1)+"s";
    document.body.appendChild(f);
  }
}

/* starfield */
const cv=document.getElementById("sky"),cx=cv.getContext("2d");
let W,H,stars=[];
function sizeSky(){
  W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  const n=Math.min(240,Math.floor(innerWidth*innerHeight/4200));stars=[];
  for(let i=0;i<n;i++){
    const band=Math.random()<0.55;let x=Math.random(),y=Math.random();
    if(band){const t=-0.3+Math.random()*1.6;x=0.26+t*0.44+(Math.random()-0.5)*0.12;y=0.18+t*0.32+(Math.random()-0.5)*0.12;}
    stars.push({x:x*W,y:y*H,r:(Math.random()*1.3+0.3)*devicePixelRatio,a:Math.random()*0.5+0.4,sp:Math.random()*0.9+0.3,ph:Math.random()*6.28,band});
  }
}
let t0=performance.now();
function drawSky(nw){
  const dt=(nw-t0)/1000;cx.clearRect(0,0,W,H);
  for(const s of stars){
    const tw=reduceMotion?1:(0.6+0.4*Math.sin(dt*s.sp+s.ph));
    cx.globalAlpha=Math.min(1,s.a*tw*(s.band?0.85:1));
    cx.fillStyle=s.band?"#cdd7ff":"#f2f6ff";
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.2832);cx.fill();
  }
  cx.globalAlpha=1;requestAnimationFrame(drawSky);
}

/* ---------- Tanabata meeting animation ---------- */
function meetAnim(){
  if(reduceMotion)return;
  const cx=0.50*innerWidth, cy=0.46*innerHeight;           // meeting point: near screen center
  const rad=MW_ANGLE*Math.PI/180;
  const perpx=-Math.sin(rad), perpy=Math.cos(rad);         // across-the-river direction
  const D=Math.min(innerWidth,innerHeight)*0.44;           // how far each bank is from center
  const oS={x:cx+perpx*D, y:cy+perpy*D};                   // Orihime's bank
  const hS={x:cx-perpx*D, y:cy-perpy*D};                   // Hikoboshi's bank
  const ori=document.createElement("div");ori.className="mote ori";ori.style.left=oS.x+"px";ori.style.top=oS.y+"px";
  const hik=document.createElement("div");hik.className="mote hiko";hik.style.left=hS.x+"px";hik.style.top=hS.y+"px";
  document.body.appendChild(ori);document.body.appendChild(hik);
  const T=2600,ease="cubic-bezier(.42,0,.28,1)";
  const aOri=ori.animate([{transform:"translate(-50%,-50%)",opacity:0},{opacity:1,offset:0.12},{transform:"translate(-50%,-50%) translate("+(cx-oS.x)+"px,"+(cy-oS.y)+"px)",opacity:1}],{duration:T,easing:ease,fill:"forwards"});
  hik.animate([{transform:"translate(-50%,-50%)",opacity:0},{opacity:1,offset:0.12},{transform:"translate(-50%,-50%) translate("+(cx-hS.x)+"px,"+(cy-hS.y)+"px)",opacity:1}],{duration:T,easing:ease,fill:"forwards"});
  showCaption("織姫と彦星、年に一度の逢瀬",3600);
  aOri.onfinish=()=>{
    const bloom=document.createElement("div");bloom.className="bloom";bloom.style.left=cx+"px";bloom.style.top=cy+"px";document.body.appendChild(bloom);
    bloom.animate([{opacity:0,transform:"translate(-50%,-50%) scale(.4)"},{opacity:1,transform:"translate(-50%,-50%) scale(1.8)"},{opacity:0,transform:"translate(-50%,-50%) scale(2.6)"}],{duration:1600,easing:"ease-out"}).onfinish=()=>bloom.remove();
    for(let i=0;i<10;i++){
      const s=document.createElement("div");s.className="spark";s.style.left=cx+"px";s.style.top=cy+"px";document.body.appendChild(s);
      const ang=Math.random()*6.283,dist=26+Math.random()*40;
      s.animate([{opacity:1,transform:"translate(-50%,-50%)"},{opacity:0,transform:"translate(-50%,-50%) translate("+Math.cos(ang)*dist+"px,"+Math.sin(ang)*dist+"px)"}],{duration:1000+Math.random()*500,easing:"ease-out"}).onfinish=()=>s.remove();
    }
    ori.animate([{opacity:1},{opacity:0}],{duration:1400,delay:600,easing:"ease-out"}).onfinish=()=>ori.remove();
    hik.animate([{opacity:1},{opacity:0}],{duration:1400,delay:600,easing:"ease-out"}).onfinish=()=>hik.remove();
  };
}

/* ---------- grove model ---------- */
const NEW="tanabata:groves", OLD="tanabata:wishes", CAP=12, INIT_GROVES=3;
function uid(p){return (p||"")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function newGrove(){return {id:uid("g"),wishes:[]};}
function paginate(flat){
  const gs=[];
  for(let i=0;i<flat.length;i+=CAP){const g=newGrove();g.wishes=flat.slice(i,i+CAP);gs.push(g);}
  while(gs.length<INIT_GROVES)gs.push(newGrove());
  return gs;
}
function flatten(){return groves.reduce((a,g)=>a.concat(g.wishes),[]);}
/* 共有API: 全短冊を古い順のフラット配列で取得 */
async function fetchWishes(){
  const res=await fetch(WISHES_API,{cache:"no-store"});
  if(!res.ok)throw new Error("GET "+res.status);
  const o=await res.json();return (o&&o.wishes)||[];
}
async function loadState(){
  if(SHARED){
    try{
      const flat=await fetchWishes();
      try{localStorage.setItem(CACHE,JSON.stringify(flat));}catch(e){}
      return {groves:paginate(flat),current:0};
    }catch(e){
      /* オフライン等: キャッシュがあれば表示 */
      try{const c=localStorage.getItem(CACHE);if(c){const flat=JSON.parse(c);if(flat.length)return {groves:paginate(flat),current:0};}}catch(e2){}
      return null;
    }
  }
  /* 端末内(localStorage)モード */
  try{if(window.storage){const r=await window.storage.get(NEW);if(r&&r.value){const o=JSON.parse(r.value);if(o&&o.groves&&o.groves.length)return o;}}}catch(e){}
  try{if(window.storage){const o=await window.storage.get(OLD);if(o&&o.value){const flat=JSON.parse(o.value);return {groves:paginate(flat),current:0};}}}catch(e){}
  return null;
}
async function saveState(){
  if(SHARED){ /* サーバが正。ローカルはオフライン用キャッシュのみ */
    try{localStorage.setItem(CACHE,JSON.stringify(flatten()));}catch(e){}
    return;
  }
  try{if(window.storage){await window.storage.set(NEW,JSON.stringify({groves,current:gi}));}}catch(e){console.warn("save failed",e);}
}
/* 共有モード: 他の人が追加した短冊を定期的に取り込む */
async function refreshShared(){
  if(!SHARED||anyModalOpen()||dragging||document.hidden)return;
  let flat;
  try{flat=await fetchWishes();}catch(e){return;}
  if(flat.length===flatten().length)return;   /* 件数に変化がなければ何もしない */
  const keep=gi;
  groves=flat.length?paginate(flat):(function(){const a=[];while(a.length<INIT_GROVES)a.push(newGrove());return a;})();
  gi=Math.min(keep,groves.length-1);
  buildPanels(false);updateNav();
  try{localStorage.setItem(CACHE,JSON.stringify(flat));}catch(e){}
}
function groveComplete(g){const set=new Set(g.wishes.map(w=>w.color));return COLORS.every(c=>set.has(c));}

/* ---------- state ---------- */
let groves=[], gi=0;
const wrap=document.getElementById("stage-wrap");
const track=document.getElementById("track");
function curr(){return groves[gi];}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function makeHang(w,idx,mirror){
  const a=anchorFor(idx);
  const x=mirror?(100-a.x):a.x;
  const hang=document.createElement("div");hang.className="hang";
  hang.style.left=x+"%";hang.style.top=a.y+"%";
  hang.style.setProperty("--dur",(4+Math.random()*3).toFixed(2)+"s");
  hang.style.setProperty("--del",(-Math.random()*3).toFixed(2)+"s");
  hang.style.setProperty("--a",(-1.6-Math.random()*1.6).toFixed(2)+"deg");
  const shown=w.text.length>16?w.text.slice(0,16)+"…":w.text;
  hang.innerHTML='<div class="thread"></div><div class="knot"></div><div class="tanzaku c-'+w.color+'">'+escapeHtml(shown)+'</div>';
  hang.addEventListener("click",()=>openReader(w));
  return hang;
}
function emptyEl(){
  const e=document.createElement("div");e.className="empty";
  e.innerHTML='<span class="ico">✦</span>この竹にはまだ短冊がありません<br>願い事をかけてみましょうか';
  return e;
}
function buildPanels(entrance){
  track.innerHTML="";track.style.setProperty("--n",groves.length);
  groves.forEach((g,idx)=>{
    const mirror=idx%2===1;
    const panel=document.createElement("div");panel.className="panel";
    panel.innerHTML='<div class="column">'+BAMBOO_SVG+'<div class="tz-layer"></div></div>';
    if(mirror)panel.querySelector(".bamboo").classList.add("mirror");
    const layer=panel.querySelector(".tz-layer");
    if(g.wishes.length===0){layer.appendChild(emptyEl());}
    else g.wishes.forEach((w,i)=>layer.appendChild(makeHang(w,i,mirror)));
    track.appendChild(panel);
  });
  positionTrack(false);
  if(entrance)entranceAnim();
}
function renderGrove(index){
  const panel=track.children[index];if(!panel)return;
  const mirror=index%2===1;
  const layer=panel.querySelector(".tz-layer");layer.innerHTML="";
  const g=groves[index];
  if(g.wishes.length===0){layer.appendChild(emptyEl());}
  else g.wishes.forEach((w,i)=>layer.appendChild(makeHang(w,i,mirror)));
}
function entranceAnim(){
  if(reduceMotion)return;
  const panel=track.children[gi];if(!panel)return;
  panel.querySelectorAll(".hang").forEach((h,i)=>{
    h.style.opacity="0";
    h.animate([{opacity:0},{opacity:1}],{duration:520,delay:Math.min(i*70,1000),easing:"ease-out",fill:"forwards"});
  });
}
function positionTrack(animate){
  const w=wrap.clientWidth;
  track.style.transition=animate?"transform .42s cubic-bezier(.2,.8,.2,1)":"none";
  track.style.transform="translateX("+(-gi*w)+"px)";
}
addEventListener("resize",()=>{sizeSky();positionTrack(false);});

/* ---------- edge nav ---------- */
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next");
function updateNav(){prevBtn.hidden=gi<=0;nextBtn.hidden=gi>=groves.length-1;}
function switchTo(i){
  if(i<0||i>=groves.length||i===gi)return;
  gi=i;positionTrack(true);updateNav();saveState();hideHint();
}
prevBtn.onclick=()=>switchTo(gi-1);
nextBtn.onclick=()=>switchTo(gi+1);

/* ---------- hint ---------- */
const hintEl=document.getElementById("hint");let hintT=null,hintDone=false;
function showHint(){
  if(hintDone)return;
  hintEl.innerHTML="スワイプ／左右の矢印で竹を移動 ・ 短冊をタップで願い事";
  hintEl.classList.add("on");

}

/* ---------- horizontal drag ---------- */
let dragging=false,startX=0,startY=0,curDx=0,decided=false,isH=false,suppressClick=false;
wrap.addEventListener("pointerdown",e=>{
  dragging=true;startX=e.clientX;startY=e.clientY;curDx=0;decided=false;isH=false;
  track.style.transition="none";
});
addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-startX,dy=e.clientY-startY;
  if(!decided){if(Math.abs(dx)>7||Math.abs(dy)>7){decided=true;isH=Math.abs(dx)>Math.abs(dy);}}
  if(!isH)return;
  let d=dx;
  if((gi===0&&d>0)||(gi===groves.length-1&&d<0))d*=0.35;
  curDx=d;
  track.style.transform="translateX("+(-gi*wrap.clientWidth+d)+"px)";
});
function endDrag(){
  if(!dragging)return;dragging=false;
  if(isH){
    const w=wrap.clientWidth,th=w*0.2;
    if(curDx<-th&&gi<groves.length-1)gi++;
    else if(curDx>th&&gi>0)gi--;
    if(Math.abs(curDx)>6){suppressClick=true;hideHint();}
    positionTrack(true);updateNav();saveState();
  }
  curDx=0;
}
addEventListener("pointerup",endDrag);
addEventListener("pointercancel",endDrag);
wrap.addEventListener("click",e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false;}},true);

/* ---------- compose ---------- */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
const wishI=document.getElementById("wish"),whoI=document.getElementById("who"),submit=document.getElementById("submit");
const wishCount=document.getElementById("wish-count");

  sw.onclick=pick;sw.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();pick();}};

submit.onclick=async()=>{
  const text=wishI.value.trim();if(!text)return;
  submit.disabled=true;
  let w;
  if(SHARED){
    /* サーバへ投稿し、採番済みの短冊を受け取る */
    try{
      const res=await fetch(WISHES_API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text,name:whoI.value.trim(),color})});
      if(!res.ok)throw new Error("POST "+res.status);
      const o=await res.json();w=o.wish;
    }catch(e){
      showCaption("送信できませんでした。通信環境をご確認ください",3000);
      submit.disabled=false;return;
    }
  }else{
    w={id:uid("w"),text,name:whoI.value.trim(),color,at:Date.now()};
  }
  /* 反映先: 共有モードは常に最新の竹(末尾)、端末内モードは今見ている竹 */
  const targetIndex=SHARED?groves.length-1:gi;
  const target=groves[targetIndex];
  const spill=target.wishes.length>=CAP;
  let completedNow=false, landedIndex;
  if(spill){const g=newGrove();g.wishes.push(w);groves.push(g);landedIndex=groves.length-1;buildPanels();}
  else{const before=groveComplete(target);target.wishes.push(w);completedNow=!before&&groveComplete(target);landedIndex=targetIndex;renderGrove(targetIndex);}
  await saveState();closeSheet();
  wishI.value="";whoI.value="";shootingStar();
  /* 吊るした竹へ移動して見せる */
  requestAnimationFrame(()=>{
    gi=landedIndex;positionTrack(true);updateNav();
    if(!spill){
      const el=track.children[gi].querySelector(".tz-layer").lastElementChild;
      if(el)el.animate([{opacity:0,transform:"translateY(-14px)"},{opacity:1,transform:"translateY(0)"}],{duration:700,easing:"ease-out"});
    }
  });
  if(completedNow)setTimeout(fiveColorBurst,380);
};

/* ---------- modal state helper + auto meeting ---------- */

/* ---------- init ---------- */
(async function init(){
  const s=await loadState();
  if(s===null){
    if(SHARED){
      /* 共有ボードの初期表示は空の竹（サンプルは入れない） */
      groves=[];while(groves.length<INIT_GROVES)groves.push(newGrove());gi=0;
    }else{
      const g0=newGrove();
      g0.wishes=[
        {id:uid("w"),text:"星空の下でみんなが笑顔になりますように",name:"",color:"midori",at:Date.now()-86400000},
        {id:uid("w"),text:"家族がずっと元気でいますように",name:"",color:"aka",at:Date.now()-3600000}
      ];
      groves=[g0];while(groves.length<INIT_GROVES)groves.push(newGrove());
      gi=0;await saveState();
    }
  }else{
    groves=s.groves;gi=Math.min(s.current||0,groves.length-1);
  }
  buildPanels(true);updateNav();
  setTimeout(showHint,900);
  setTimeout(()=>{if(!anyModalOpen())meetAnim();},3600);
  setInterval(()=>{if(!anyModalOpen()&&!document.hidden)meetAnim();},48000);
  if(SHARED){
    /* 他の人の短冊を定期的に取り込む＋タブに戻った時にも更新 */
    setInterval(refreshShared,45000);
    addEventListener("visibilitychange",()=>{if(!document.hidden)refreshShared();});
  }
})();
</script>
