<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント管理 - Admin</title>
    
    <script>
        if (!sessionStorage.getItem('orbit_admin_auth')) {
            window.location.replace('login.html');
        }
    </script>
    <style>
        body { display: none; }
    </style>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="assets/img/lifelog_mark.png">
    <style>
        .admin-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
        .calendar-section { background: rgba(5, 10, 20, 0.6); border: 1px solid var(--accent-gold); border-radius: 8px; padding: 1.5rem; }
        .calendar-day { min-height: 60px; font-size: 0.9rem; }
        .calendar-day.selected { background: rgba(212, 175, 55, 0.3); border: 2px solid var(--accent-gold); }
        .manage-panel { display: flex; flex-direction: column; gap: 1.5rem; }
        .panel-box { background: var(--panel-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .event-item { background: rgba(255,255,255,0.05); padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; border-left: 3px solid var(--accent-gold); display: flex; justify-content: space-between; align-items: center; }
        .event-info { cursor: pointer; flex-grow: 1; }
        .btn-delete { background: #ff4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-left: 10px;}
        
        #preview-area { margin-top: 10px; text-align: center; display: none; }
        #preview-img { max-width: 100%; max-height: 200px; border: 1px solid #444; border-radius: 4px; }
        
        select {
            background-color: #050a14;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px;
            border-radius: 4px;
        }
        option {
            background-color: #050a14;
            color: #fff;
        }

        /* ▼▼▼ 配色クラスの変更 ▼▼▼ */
        .event-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin: 1px;
        }
        .dot-meteor { background-color: #28e070; box-shadow: 0 0 4px #28e070; }  /* 緑 */
        .dot-eclipse { background-color: #ffcc00; box-shadow: 0 0 4px #ffcc00; } /* 黄 */
        .dot-phenomenon { background-color: #3399ff; box-shadow: 0 0 4px #3399ff; } /* 青 */
        .dot-rocket { background-color: #ff5544; box-shadow: 0 0 4px #ff5544; }  /* 赤 */
        .dot-other { background-color: #dddddd; box-shadow: 0 0 4px #dddddd; }   /* グレー */
        /* ▲▲▲ 変更ここまで ▲▲▲ */

        @media (max-width: 900px) { .admin-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="common-header">
        <a href="index.html" class="header-back-btn">トップへ戻る</a>
        <h1 class="page-title">管理者コンソール</h1>
        <button onclick="logout()" style="position:absolute; right:20px; top:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:5px 10px; cursor:pointer; border-radius:4px;">ログアウト</button>
    </header>

    <div class="container admin-wrapper">
        <div class="calendar-section">
            <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; border:none; margin-bottom:1rem;">
                <button class="btn-submit" id="prev-month" style="width:auto; padding:5px 15px;">&lt;</button>
                <div id="current-month" style="font-size:1.3rem; color:var(--accent-gold);">----年 --月</div>
                <button class="btn-submit" id="next-month" style="width:auto; padding:5px 15px;">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <div class="manage-panel">
            <div class="panel-box">
                <h2 class="section-header" id="selected-date-label">日付を選択してください</h2>
                <div id="event-list-display"><p style="opacity:0.5;">カレンダーの日付をクリックしてください。</p></div>
            </div>

            <div class="panel-box">
                <h3 class="section-header">✏️ 編集 / 新規登録</h3>
                <form id="admin-form">
                    <div style="margin-bottom:1rem;">
                        <label>🔑 合言葉 (Password)</label>
                        <input type="password" id="input-password" placeholder="luna1234" required>
                    </div>
                    
                    <input type="hidden" id="input-id">
                    <input type="hidden" id="input-date">
                    
                    <input type="hidden" id="final-image-url"> 

                    <div class="form-row">
                        <div>
                            <label>タイトル</label>
                            <input type="text" id="input-title" required>
                        </div>
                        <div>
                            <label>タイプ</label>
                            <select id="input-type">
                                <option value="meteor">💫 流星群</option>
                                <option value="eclipse">🌕 月・太陽</option>
                                <option value="phenomenon">🪐 天文現象</option>
                                <option value="rocket">🚀 ロケット打上</option>
                                <option value="other">✨ その他</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label>時間</label>
                        <input type="text" id="input-time" placeholder="例: 22:00頃">
                    </div>
                    
                    <div>
                        <label>画像 (ファイルを選択)</label>
                        <input type="file" id="input-file" accept="image/*">
                        <div id="preview-area">
                            <p style="font-size:0.8rem; opacity:0.7;">現在の設定画像:</p>
                            <img id="preview-img" src="">
                            <button type="button" id="btn-clear-img" style="font-size:0.8rem; margin-top:5px;">画像を削除</button>
                        </div>
                    </div>

                    <div>
                        <label>詳細・説明</label>
                        <textarea id="input-desc" rows="3" required></textarea>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:1rem;">
                        <button type="submit" class="btn-submit" id="btn-save">この内容で保存</button>
                        <button type="button" class="btn-submit" id="btn-clear" style="background:#555;">クリア</button>
                    </div>
                    <p id="msg-status" style="margin-top:10px; font-weight:bold; color:var(--accent-gold);"></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        const GET_URL = "https://jjrfmiwd63rogmf7ockaffndty0ddhly.lambda-url.ap-northeast-1.on.aws/";
        const PUT_URL = "https://3k3w7lgiohcqh4i6m4zac534ju0nlvyx.lambda-url.ap-northeast-1.on.aws/";

        let eventsData = {};
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        let selectedDateStr = "";

        const gridEl = document.getElementById('calendar-grid');
        const monthLabelEl = document.getElementById('current-month');
        const selectedDateLabel = document.getElementById('selected-date-label');
        const listDisplay = document.getElementById('event-list-display');
        const form = document.getElementById('admin-form');
        const btnSave = document.getElementById('btn-save');
        const statusMsg = document.getElementById('msg-status');
        
        const inputFile = document.getElementById('input-file');
        const previewArea = document.getElementById('preview-area');
        const previewImg = document.getElementById('preview-img');
        const finalImageUrl = document.getElementById('final-image-url');
        const btnClearImg = document.getElementById('btn-clear-img');

        function logout() {
            sessionStorage.removeItem('orbit_admin_auth');
            sessionStorage.removeItem('orbit_admin_pass');
            window.location.href = 'login.html';
        }

        init();

        async function init() {
            document.body.style.display = 'block'; 
            const savedPass = sessionStorage.getItem('orbit_admin_pass');
            if(savedPass) {
                document.getElementById('input-password').value = savedPass;
            }

            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            selectedDateStr = `${y}-${m}-${d}`;
            
            await fetchAllEvents();
            renderCalendar(currentYear, currentMonth);
            selectDate(selectedDateStr);
        }

        async function fetchAllEvents() {
            try {
                const res = await fetch(GET_URL);
                if(!res.ok) throw new Error("Fetch failed");
                eventsData = await res.json();
            } catch (e) {
                console.error(e);
                alert("データの読み込みに失敗しました。GET_URLを確認してください。");
            }
        }

        function renderCalendar(year, month) {
            gridEl.innerHTML = '';
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            days.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.style.textAlign='center'; div.style.fontSize='0.8rem'; div.style.color='rgba(255,255,255,0.6)';
                div.textContent = d;
                gridEl.appendChild(div);
            });
            monthLabelEl.textContent = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) gridEl.appendChild(document.createElement('div'));
            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day';
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                if (dateStr === selectedDateStr) cell.classList.add('selected');
                const numDiv = document.createElement('div');
                numDiv.textContent = d; numDiv.style.fontWeight='bold';
                cell.appendChild(numDiv);
                if (eventsData[dateStr]) {
                    eventsData[dateStr].forEach(evt => {
                        const dot = document.createElement('span');
                        dot.className = `event-dot dot-${evt.type || 'other'}`;
                        cell.appendChild(dot);
                    });
                }
                cell.addEventListener('click', () => selectDate(dateStr));
                gridEl.appendChild(cell);
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            selectedDateLabel.textContent = `${dateStr} のイベント`;
            document.getElementById('input-date').value = dateStr;
            document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
            renderCalendar(currentYear, currentMonth);
            renderEventList(dateStr);
            clearForm();
        }

        function renderEventList(dateStr) {
            listDisplay.innerHTML = '';
            const events = eventsData[dateStr] || [];
            if (events.length === 0) {
                listDisplay.innerHTML = '<p style="opacity:0.6;">イベントは登録されていません。</p>';
                return;
            }
            events.forEach(evt => {
                const div = document.createElement('div');
                div.className = 'event-item';
                div.innerHTML = `
                    <div class="event-info" onclick='loadToForm(${JSON.stringify(evt)})'>
                        <strong>${evt.title}</strong>
                        <span style="font-size:0.8rem; opacity:0.7; margin-left:8px;">${evt.type}</span>
                    </div>
                    <button class="btn-delete" onclick='deleteEvent("${evt.id}")'>削除</button>
                `;
                listDisplay.appendChild(div);
            });
        }

        window.loadToForm = (evt) => {
            document.getElementById('input-id').value = evt.id || "";
            document.getElementById('input-title').value = evt.title;
            document.getElementById('input-type').value = evt.type;
            document.getElementById('input-time').value = evt.time;
            document.getElementById('input-desc').value = evt.desc;
            
            finalImageUrl.value = evt.image || "";
            if (evt.image) {
                previewImg.src = evt.image;
                previewArea.style.display = 'block';
            } else {
                previewArea.style.display = 'none';
            }
            
            inputFile.value = "";
            btnSave.textContent = "更新する (上書き)";
            btnSave.style.background = "#4CAF50";
            statusMsg.textContent = "📝 編集モード";
        };

        function clearForm() {
            document.getElementById('input-id').value = "";
            document.getElementById('input-title').value = "";
            document.getElementById('input-desc').value = "";
            document.getElementById('input-time').value = "";
            
            finalImageUrl.value = "";
            inputFile.value = "";
            previewArea.style.display = 'none';

            btnSave.textContent = "この内容で新規登録";
            btnSave.style.background = "var(--accent-gold)";
            statusMsg.textContent = "";
        }
        document.getElementById('btn-clear').addEventListener('click', clearForm);

        btnClearImg.addEventListener('click', () => {
            finalImageUrl.value = "";
            previewArea.style.display = 'none';
            inputFile.value = "";
        });

        async function uploadImage(file) {
            const password = document.getElementById('input-password').value;
            const res = await fetch(PUT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: password,
                    action: 'getUploadUrl',
                    fileName: file.name,
                    fileType: file.type
                })
            });
            if (!res.ok) throw new Error("アップロード許可の取得に失敗 (合言葉は正しいですか？)");
            const data = await res.json();
            const uploadRes = await fetch(data.uploadUrl, {
                method: 'PUT',
                body: file,
                headers: { 'Content-Type': file.type }
            });
            if (!uploadRes.ok) throw new Error("画像のアップロードに失敗");
            return data.publicUrl;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('input-id').value;
            const action = id ? "edit" : "add";
            const password = document.getElementById('input-password').value;

            if(!password) { alert("合言葉を入力してください"); return; }
            btnSave.disabled = true;
            statusMsg.textContent = "送信中...";

            try {
                const file = inputFile.files[0];
                if (file) {
                    statusMsg.textContent = "画像をアップロード中...";
                    const uploadedUrl = await uploadImage(file);
                    finalImageUrl.value = uploadedUrl;
                }

                statusMsg.textContent = "データを保存中...";

                const eventData = {
                    id: id,
                    title: document.getElementById('input-title').value,
                    type: document.getElementById('input-type').value,
                    time: document.getElementById('input-time').value,
                    image: finalImageUrl.value,
                    desc: document.getElementById('input-desc').value
                };

                const res = await fetch(PUT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: password,
                        date: selectedDateStr,
                        action: action,
                        eventData: eventData
                    })
                });
                
                const result = await res.json();
                
                if(res.ok) {
                    statusMsg.textContent = "✅ 処理完了！";
                    await fetchAllEvents();
                    renderCalendar(currentYear, currentMonth);
                    renderEventList(selectedDateStr);
                    if(action !== 'edit') clearForm();
                } else {
                    statusMsg.textContent = "⛔ エラー: " + result.message;
                    if(result.message === "合言葉が違います") {
                        alert("合言葉が違います。確認してください。");
                    }
                }
            } catch(e) {
                console.error(e);
                statusMsg.textContent = "エラー: " + e.message;
            } finally {
                btnSave.disabled = false;
            }
        });

        window.deleteEvent = async (id) => {
            if(!confirm("本当に削除しますか？")) return;
            const password = document.getElementById('input-password').value;
            if(!password) { alert("合言葉を入力してください"); return; }
            try {
                const res = await fetch(PUT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: password,
                        date: selectedDateStr,
                        action: 'delete',
                        eventData: { id: id }
                    })
                });
                if(res.ok) {
                    await fetchAllEvents();
                    renderCalendar(currentYear, currentMonth);
                    renderEventList(selectedDateStr);
                } else {
                    alert("削除失敗: 合言葉を確認してください");
                }
            } catch(e) { alert("通信エラー"); }
        };

        document.getElementById('prev-month').addEventListener('click', () => {
            currentMonth--; 
            if(currentMonth < 0){ currentMonth = 11; currentYear--; } 
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById('next-month').addEventListener('click', () => {
            currentMonth++; 
            if(currentMonth > 11){ currentMonth = 0; currentYear++; } 
            renderCalendar(currentYear, currentMonth);
        });
    </script>
</body>
</html>
