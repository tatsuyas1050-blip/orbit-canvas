<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙シアター - Space Theater</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    
    <style>
         /* Theater specific extra styles */
        .section-content { display: none; animation: fadeIn 0.5s ease; }
        .section-content.active { display: block; }
        
        /* 準備中表示用のスタイル */
        .coming-soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
            text-align: center;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(5, 10, 20, 0.4);
            color: rgba(255, 255, 255, 0.6);
            min-height: 300px;
        }
        
        .coming-soon-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        
        .coming-soon-text {
            font-size: 0.9rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        /* --- タブナビゲーションのスタイル --- */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 0;
        }

        /* スマートフォン向け調整 */
        @media (max-width: 900px) {
            .tab-nav {
                gap: 0.5rem; /* 間隔を狭くする */
                padding: 1.5rem 0;
            }
            .tab-btn {
                font-size: 0.85rem !important; /* 文字を少し小さく */
                white-space: nowrap; /* 改行を禁止して1行に収める */
                padding: 0 5px; /* 左右の余白を微調整 */
            }
        }
    </style>
</head>
<body>
    
    <div class="menu-container">
        <button id="menu-toggle" class="menu-toggle" aria-label="メニューを開く">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>
        
        <nav id="nav-overlay" class="nav-overlay">
<ul class="nav-list">
    <li><a href="index.html" class="nav-link">トップページ<span>Home</span></a></li>
    <li><a href="/stars" class="nav-link">星を探す<span>Star Chart</span></a></li>
    <li><a href="/events" class="nav-link">星空情報局<span>Sky Events</span></a></li>
    <li><a href="/lifelog" class="nav-link">星空ライフログ<span>My Starry Sky Log</span></a></li>
</ul>
        </nav>
    </div>

    <header class="common-header">
        <a href="index.html" class="header-back-btn">トップへ戻る</a>
        <h1 class="page-title">宇宙シアター<span>Space Theater</span></h1>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn active" data-target="tab-live">LIVE 配信</button>
        <button class="tab-btn" data-target="tab-archive">動画アーカイブ</button>
        <button class="tab-btn" data-target="tab-gallery">天体写真館</button>
    </nav>

    <div class="container">
        
        <div id="tab-live" class="section-content active">
            <div class="coming-soon-container">
                <h2 class="coming-soon-title">Coming Soon</h2>
                <p class="coming-soon-text">
                    リアルタイム配信を準備中です。<br>
                    公開まで今しばらくお待ちください。
                </p>
            </div>
        </div>

        <div id="tab-archive" class="section-content">
            <div class="coming-soon-container">
                <h2 class="coming-soon-title">動画アーカイブ準備中</h2>
                <p class="coming-soon-text">
                    過去の観望会の様子や解説動画を準備中です。<br>
                    コンテンツの追加をお楽しみに。
                </p>
            </div>
        </div>

        <div id="tab-gallery" class="section-content">
            <div class="coming-soon-container">
                <h2 class="coming-soon-title">天体写真館準備中</h2>
                <p class="coming-soon-text">
                    美しい星空の写真をギャラリー形式で公開予定です。
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script>
        // タブ切り替え機能
        const tabBtns = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.section-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>
