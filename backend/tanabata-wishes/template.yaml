AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  orbit-canvas 七夕短冊 — みんなで共有する願い事API。
  誰でも短冊を投稿(POST)・閲覧(GET)できる公開エンドポイント。
  Lambda(Function URL) + S3（1個のJSONファイルに全短冊を保存）。認証・承認なし。

Parameters:
  AllowOrigin:
    Type: String
    Default: '*'
    Description: >
      CORS で許可するオリジン。公開ボードなので既定は '*'。
      サイト限定にするなら 'https://cosmos-connect.com' などに変更。
  MaxWishes:
    Type: String
    Default: '1000'
    Description: GET で返す短冊の最大件数（=竹 約83本ぶん）。

Resources:
  # 願い事を保存する非公開バケット（アクセスはLambda経由のみ）。名前はCFNが自動採番。
  WishesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WishesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orbit-canvas-tanabata-wishes
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: ./
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref WishesBucket
          WISHES_KEY: wishes.json
          MAX_WISHES: !Ref MaxWishes
          ALLOW_ORIGIN: !Ref AllowOrigin
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref WishesBucket
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowOrigin
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - content-type

Outputs:
  WishApiUrl:
    Description: これを tanabata.html の WISHES_API に貼り付けてください
    Value: !GetAtt WishesFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref WishesBucket
