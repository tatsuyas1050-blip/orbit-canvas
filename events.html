<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空情報局 - Sky Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Jura:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    
    <script src="https://cdn.jsdelivr.net/gh/cosinekitty/astronomy@master/source/js/astronomy.browser.min.js"></script>

    <style>
        :root {
            --bg-deep: #080c15; 
            --card-bg: rgba(30, 40, 60, 0.5);
            --card-border: rgba(255, 255, 255, 0.2);
            --glow-color: rgba(212, 175, 55, 0.3);
            --font-tech: 'Jura', sans-serif;
            
            --col-meteor: #33eaff;
            --col-eclipse: #e080ff;
            --col-phenom: #ffdd44;
            --col-rocket: #ff7777;
            --col-other: #cccccc;

            --header-height: 80px;
            --mobile-tab-height: 50px;
            --text-main: #ffffff;
            --text-sub: #d0d0d0;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, #2a3a55 0%, var(--bg-deep) 80%);
            height: 100vh; overflow: hidden; color: var(--text-main);
        }

        .common-header {
            height: var(--header-height); box-sizing: border-box;
            background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(10px);
            position: absolute; top: 0; left: 0; width: 100%; z-index: 20;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        /* --- メインレイアウト (PC) --- */
        .dashboard-container {
            max-width: 1300px; margin: 0 auto;
            padding-top: calc(var(--header-height) + 30px);
            padding-bottom: 2rem; padding-left: 2rem; padding-right: 2rem;
            height: 100vh; box-sizing: border-box;
            display: grid; grid-template-columns: 360px 1fr; gap: 2rem; 
            align-items: start; overflow: hidden; 
        }

        .left-column {
            height: 100%; overflow-y: auto; scrollbar-width: none;
            display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem;
        }
        .left-column::-webkit-scrollbar { display: none; }

        .event-feed { 
            height: 100%; overflow-y: auto; padding: 0 1rem 4rem 0; 
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
            position: relative;
        }
        .event-feed::-webkit-scrollbar { width: 6px; }
        .event-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

        .monthly-feed-area { display: none; height: 100%; overflow-y: auto; padding-bottom: 4rem; }

        /* --- UI パーツ --- */
        .date-heading {
            font-family: var(--font-tech); font-size: 2.5rem; line-height: 1;
            color: rgba(255,255,255,0.2); 
            position: sticky; top: 0; z-index: 10;
            background: transparent; backdrop-filter: blur(20px);
            margin: 0 0 1.5rem 0; padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: space-between;
        }
        .date-heading-text span { color: #fff; font-weight: 600; }
        .date-heading-text small { font-size:1.2rem; opacity:1; color:#ddd; margin-left:10px; font-weight: 400; }

        /* アニメーション用クラス */
        .fade-anim {
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: translateY(0);
        }
        .fade-out {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none; 
        }

        .smart-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; backdrop-filter: blur(12px);
            position: relative; overflow: hidden; flex-shrink: 0; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
        }
        @media (hover: hover) {
            .smart-card:hover { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        }

        /* カレンダー */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem 0.5rem; }
        .month-display { font-family: var(--font-tech); font-size: 1.4rem; letter-spacing: 0.1em; color: #fff; font-weight: bold; }
        .month-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #ccc; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 1rem 1rem; }
        .day-label { text-align: center; font-size: 0.75rem; color: #bbb; padding-bottom: 5px; font-weight: bold; }
        .cal-cell { 
            aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            padding-top: 6px; border-radius: 6px; cursor: pointer; position: relative; 
            transition: all 0.2s; font-family: var(--font-tech); color: #ccc; font-size: 0.95rem;
            background: rgba(255,255,255,0.02);
        }
        .cal-cell.today { color: var(--accent-gold); font-weight: bold; border: 1px solid rgba(212,175,55,0.5); background: rgba(212,175,55,0.1); }
        .cal-cell.selected { background: var(--accent-gold); color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); font-weight: bold; }
        .cal-dots { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; position: absolute; bottom: 6px; width: 100%; padding: 0 2px; }
        .cal-dot { width: 5px; height: 5px; border-radius: 50%; display: block; }
        
        .dot-meteor { background: var(--col-meteor); box-shadow: 0 0 4px var(--col-meteor); }
        .dot-eclipse { background: var(--col-eclipse); box-shadow: 0 0 4px var(--col-eclipse); }
        .dot-phenomenon { background: var(--col-phenom); box-shadow: 0 0 4px var(--col-phenom); }
        .dot-rocket { background: var(--col-rocket); box-shadow: 0 0 4px var(--col-rocket); }
        .dot-other { background: var(--col-other); }

        .legend-area { border-top: 1px solid rgba(255,255,255,0.15); padding: 0.8rem 1rem; display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #ddd; }
        .legend-mark { width: 8px; height: 8px; border-radius: 50%; }

        /* 天文パネル */
        .astro-panel { padding: 1.2rem; }
        .astro-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 0.6rem; margin-bottom: 0.8rem; }
        .astro-title { font-size: 0.9rem; color: var(--accent-gold); letter-spacing: 0.1em; display:flex; flex-direction:column; line-height:1.2; font-weight: bold; }
        .astro-date-sub { font-size: 0.75rem; color: #aaa; font-family: var(--font-tech); font-weight: normal; }
        .location-control { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .btn-geo { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #ddd; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; }
        .geo-info { font-family: var(--font-tech); font-size: 0.7rem; color: #aaa; }
        
        .moon-viz { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        #moon-canvas { width: 50px; height: 50px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
        .moon-text { text-align: right; }
        .moon-age-label { font-size: 0.8rem; color: #bbb; }
        .moon-age-val { font-family: var(--font-tech); font-size: 1.3rem; color: #fff; font-weight: bold; }
        
        .astro-grid { display: block; }
        .astro-row { display: flex; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.9rem; }
        .astro-label { color: #ccc; }
        .astro-val { font-family: var(--font-tech); color: #fff; }
        .sun-icon { color: #ffbd5e; margin-right: 5px; text-shadow: 0 0 5px #ffbd5e; }
        .moon-icon { color: #e0e0e0; margin-right: 5px; text-shadow: 0 0 5px #e0e0e0; }
        .divider-hr { border:0; border-top:1px dashed rgba(255,255,255,0.2); margin:10px 0; }

        /* --- フィードカード (PC用デフォルト) --- */
        .feed-card {
            margin-bottom: 2rem; display: grid; grid-template-columns: 200px 1fr;
            overflow: hidden; animation: slideIn 0.4s ease forwards; opacity: 0; transform: translateY(10px);
            cursor: pointer; border-left: 5px solid var(--col-other); background: rgba(35, 45, 65, 0.6);
        }
        .feed-card.type-meteor { border-left-color: var(--col-meteor); }
        .feed-card.type-eclipse { border-left-color: var(--col-eclipse); }
        .feed-card.type-phenomenon { border-left-color: var(--col-phenom); }
        .feed-card.type-rocket { border-left-color: var(--col-rocket); }
        .feed-card.type-other { border-left-color: var(--col-other); }
        .feed-card.no-image { grid-template-columns: 1fr; }
        .feed-card.no-image .feed-img-col { display: none; }
        
        /* PCでは左側に画像 */
        .feed-img-col { background: #000; position: relative; min-height: 180px; }
        .feed-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: transform 0.5s; }
        
        .feed-content { padding: 1.5rem; display: flex; flex-direction: column; }
        .badge-row { display: flex; gap: 10px; margin-bottom: 0.6rem; }
        .smart-badge { font-size: 0.75rem; padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.4); letter-spacing: 0.05em; font-weight: 500; }
        .feed-title { font-size: 1.5rem; margin: 0 0 0.5rem; color: #fff; line-height: 1.3; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .feed-time { font-family: var(--font-tech); font-size: 0.95rem; color: #ccc; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .feed-details { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .feed-card.open .feed-details { max-height: 500px; opacity: 1; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed rgba(255,255,255,0.2); }
        .feed-desc { font-size: 1rem; line-height: 1.8; color: #e0e0e0; }
        .toggle-btn { margin-top: 0.5rem; font-size: 0.85rem; color: var(--accent-gold); opacity: 0.9; text-align: center; width: 100%; padding-top: 5px; transition: 0.3s; }
        .toggle-btn::before { content: "▼ 詳細を見る"; }
        .feed-card.open .toggle-btn::before { content: "▲ 閉じる"; }

        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; margin-bottom: 1rem; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* スマホ用タブ（初期非表示） */
        .mobile-tab-nav { display: none; }
        /* 月間一覧用ナビ（初期非表示） */
        .monthly-nav-bar { display: none; }

        /* ▼▼▼ スマートフォン最適化 (900px以下) ▼▼▼ */
        @media (max-width: 900px) {
            
            :root {
                --header-height: 60px;
            }

            body { overflow: auto; height: auto; }

            .common-header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 20;
                height: 60px; 
                padding: 0 1rem; 
            }
            .header-back-btn {
                font-size: 0;
                padding: 0;
                width: 40px; height: 40px;
                border-radius: 50%;
                justify-content: center;
                background: rgba(255, 255, 255, 0.1);
            }
            .header-back-btn::before {
                font-size: 1.2rem;
                margin-right: 0;
                transform: translateX(-1px);
            }
            .page-title {
                font-size: 1.1rem;
                width: auto;
                left: 50%; transform: translateX(-50%);
            }
            .page-title span {
                font-size: 0.65rem; margin-top: 2px;
            }
            .menu-toggle {
                top: 5px; right: 10px; transform: scale(0.8);
            }
            
            .dashboard-container { 
                display: flex; flex-direction: column;
                height: auto; 
                padding: calc(var(--header-height) + var(--mobile-tab-height) + 15px) 1rem 2rem; 
                overflow: visible; gap: 1.5rem;
            }

            /* --- タブナビゲーション (スライド式) --- */
            .mobile-tab-nav {
                display: flex; 
                justify-content: center;
                align-items: center;
                position: fixed; 
                top: var(--header-height); 
                left: 0;
                width: 100%; 
                height: auto;
                padding: 10px 0;
                background: rgba(10, 15, 25, 0.95); 
                backdrop-filter: blur(10px);
                z-index: 15; 
                border-bottom: 1px solid rgba(255,255,255,0.15);
            }

            .tab-capsule {
                display: flex; 
                gap: 5px;
                background: rgba(0, 0, 0, 0.4); 
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 4px; 
                border-radius: 30px;
                width: 90%;
                max-width: 300px; 
                position: relative; /* スライド要素の基準 */
            }

            /* ▼ スライディング背景 */
            .tab-highlight {
                position: absolute;
                top: 4px; left: 4px; bottom: 4px;
                width: calc((100% - 13px) / 2); /* (100% - padding*2 - gap) / 2 */
                border-radius: 25px;
                z-index: 0;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden;
            }

            /* ゴールド層 (デフォルト) */
            .tab-highlight::before {
                content: ''; position: absolute; inset: 0;
                background: linear-gradient(135deg, #d4af37, #b8860b);
                opacity: 1; transition: opacity 0.3s ease;
            }

            /* ブルー層 (切り替え用) */
            .tab-highlight::after {
                content: ''; position: absolute; inset: 0;
                background: linear-gradient(135deg, #00d2ff, #0077ff);
                opacity: 0; transition: opacity 0.3s ease;
            }

            /* 右へ移動 & 色変化 */
            .tab-highlight.move-right {
                transform: translateX(calc(100% + 5px)); /* width + gap(5px) */
            }
            .tab-highlight.move-right::before { opacity: 0; }
            .tab-highlight.move-right::after { opacity: 1; }
            /* ▲ ここまで */

            .m-tab-btn {
                flex: 1; 
                background: transparent; 
                border: none; 
                color: #888;
                font-family: 'Shippori Mincho', serif; 
                font-weight: 500; 
                font-size: 0.85rem; 
                padding: 6px 10px; 
                border-radius: 25px;
                cursor: pointer; 
                transition: color 0.3s ease;
                white-space: nowrap;
                position: relative; 
                z-index: 1; /* 背景より上に */
            }

            /* アクティブ時の文字色 */
            .m-tab-btn.active { 
                color: #fff;
                font-weight: bold;
                text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            }
            
            /* 古いスタイル打消し */
            .m-tab-btn.active::after { display: none; }

            .left-column.daily-view, 
            .event-feed.daily-view { display: contents; }

            /* 1. カレンダー */
            #calendar-card { order: 1; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
            .calendar-grid { gap: 2px; padding: 0 0.5rem 0.5rem; }
            .cal-cell { font-size: 0.85rem; padding-top: 4px; }
            .legend-area { padding: 0.5rem; gap: 6px 10px; }

            /* 2. 日付見出し (常に表示、クリック不可) */
            .date-heading { 
                order: 2; width: 100%; position: relative; top: 0; 
                background: transparent; backdrop-filter: none; 
                margin-bottom: 0.5rem; padding: 0.5rem 0; 
                cursor: default; 
            }
            
            /* 3. イベントリスト (常に表示) */
            #event-feed-list { 
                order: 3; width: 100%; margin-bottom: 1.5rem; 
                overflow: visible; 
                opacity: 1; 
                max-height: none; 
            }
            
            /* --- カードのレイアウト変更 (Overlayスタイル) --- */
            .feed-card {
                display: block; position: relative;
                min-height: 120px; margin-bottom: 1rem;
                border: 1px solid rgba(255,255,255,0.2);
            }

            /* 画像がある場合: 全画面背景化 */
            .feed-card:not(.no-image) .feed-img-col {
                display: block; position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                z-index: 0; border: none;
            }
            /* 黒フィルター */
            .feed-card:not(.no-image) .feed-img-col::after {
                content: '';
                position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 100%);
            }

            /* コンテンツは前面に */
            .feed-content {
                position: relative; z-index: 1;
                padding: 1rem;
                background: transparent;
                min-height: 120px;
                justify-content: center;
            }
            .feed-card.no-image .feed-content { background: rgba(35, 45, 65, 0.8); }

            /* テキスト調整 */
            .feed-title {
                font-size: 1.3rem; margin-bottom: 0.3rem;
                text-shadow: 0 2px 8px rgba(0,0,0,1);
            }
            .feed-time {
                color: #eee; font-size: 0.9rem; margin-bottom: 0.3rem;
                text-shadow: 0 1px 4px rgba(0,0,0,1);
            }
            .smart-badge {
                box-shadow: 0 2px 5px rgba(0,0,0,0.6);
            }
            .feed-details { text-shadow: 0 1px 2px rgba(0,0,0,0.9); }

            /* 4. 天文暦 */
            #astro-card { order: 4; width: 100%; margin-bottom: 4rem; padding: 1rem; }
            
            .moon-viz { justify-content: center; gap: 20px; padding: 6px; margin-bottom: 0.5rem; }
            .moon-text { text-align: left; }
            .moon-age-val { font-size: 1.1rem; }
            
            .astro-grid {
                display: grid;
                grid-template-columns: 1fr 1fr; 
                grid-template-rows: auto auto; 
                grid-auto-flow: column; 
                gap: 5px 15px; margin-top: 5px;
            }
            .astro-row { margin-bottom: 0; flex-direction: column; align-items: flex-start; }
            .astro-row span { font-size: 0.8rem; }
            .astro-val { font-size: 1rem; }
            .divider-hr { display: none; }

            /* Monthly View */
            .monthly-feed-area { display: none; width: 100%; }
            .monthly-feed-area.active-view { display: block; }
            .left-column:not(.daily-view), .event-feed:not(.daily-view) { display: none; }

            /* --- Monthly Navigation Bar --- */
            .monthly-nav-bar {
                display: flex; justify-content: space-between; align-items: center;
                background: rgba(30, 40, 60, 0.8);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 8px;
                padding: 0.5rem 1rem;
                margin-bottom: 1.5rem;
            }
            .m-nav-label { font-family: var(--font-tech); font-size: 1.2rem; font-weight: bold; color: #fff; }
            .m-nav-btn {
                background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
                color: #fff; width: 36px; height: 36px; border-radius: 50%;
                cursor: pointer; display: flex; align-items: center; justify-content: center;
            }
        }
    </style>
</head>
<body>
    
    <div class="menu-container">
        <button id="menu-toggle" class="menu-toggle" aria-label="メニューを開く">
            <span class="line"></span><span class="line"></span><span class="line"></span>
        </button>
        <nav id="nav-overlay" class="nav-overlay">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">トップページ<span>Home</span></a></li>
                <li><a href="stars.html" class="nav-link">星を探す<span>Star Chart</span></a></li>
                <li><a href="events.html" class="nav-link">星空情報局<span>Sky Events</span></a></li>
                <li><a href="theater.html" class="nav-link">宇宙シアター<span>Space Theater</span></a></li>
                <li><a href="lifelog.html" class="nav-link">星空ライフログ<span>My Starry Sky Log</span></a></li>
            </ul>
        </nav>
    </div>

    <header class="common-header">
        <a href="index.html" class="header-back-btn">トップへ戻る</a>
        <h1 class="page-title">星空情報局<span>Sky Events</span></h1>
    </header>

    <div class="mobile-tab-nav">
        <div class="tab-capsule">
            <div class="tab-highlight" id="tab-highlight"></div> <button class="m-tab-btn active" onclick="switchTab('daily')">日めくり</button>
            <button class="m-tab-btn" onclick="switchTab('monthly')">月間一覧</button>
        </div>
    </div>

    <div class="dashboard-container">
        
        <aside class="left-column daily-view" id="col-left">
            <div class="smart-card fade-anim" id="calendar-card">
                <div class="calendar-header">
                    <button class="month-nav-btn" id="prev-month">&lt;</button>
                    <div class="month-display" id="calendar-header-display">2025. --</div>
                    <button class="month-nav-btn" id="next-month">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
                <div class="legend-area">
                    <div class="legend-item"><span class="legend-mark dot-meteor"></span>流星群</div>
                    <div class="legend-item"><span class="legend-mark dot-eclipse"></span>日食・月食</div>
                    <div class="legend-item"><span class="legend-mark dot-phenomenon"></span>現象</div>
                    <div class="legend-item"><span class="legend-mark dot-rocket"></span>ロケット</div>
                </div>
            </div>

            <div class="smart-card astro-panel fade-anim" id="astro-card">
                <div class="astro-header-row">
                    <div class="astro-title">天文暦<span class="astro-date-sub" id="astro-date-display">--/--</span></div>
                    <div class="location-control">
                        <span id="geo-display" class="geo-info">📍 東京</span>
                        <button id="btn-geo" class="btn-geo">更新</button>
                    </div>
                </div>
                
                <div class="moon-viz">
                    <canvas id="moon-canvas" width="40" height="40"></canvas>
                    <div class="moon-text">
                        <div class="moon-age-label">月齢</div>
                        <div class="moon-age-val" id="moon-age-val">--</div>
                    </div>
                </div>

                <div class="astro-grid">
                    <div class="astro-row">
                        <span class="astro-label"><span class="sun-icon">☀</span>日の出</span>
                        <span class="astro-val" id="sun-rise">--:--</span>
                    </div>
                    <div class="astro-row">
                        <span class="astro-label"><span class="sun-icon">☀</span>日の入</span>
                        <span class="astro-val" id="sun-set">--:--</span>
                    </div>
                    
                    <hr class="divider-hr">
                    
                    <div class="astro-row">
                        <span class="astro-label"><span class="moon-icon">☾</span>月の出</span>
                        <span class="astro-val" id="moon-rise">--:--</span>
                    </div>
                    <div class="astro-row">
                        <span class="astro-label"><span class="moon-icon">☾</span>月の入</span>
                        <span class="astro-val" id="moon-set">--:--</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="event-feed daily-view" id="col-feed">
            <div class="date-heading fade-anim" id="daily-heading">
                <div class="date-heading-text">
                    <span id="display-date-main">--.--</span> <small id="display-weekday">---</small>
                </div>
            </div>
            <div id="event-feed-list" class="fade-anim">
                <div class="skeleton" style="height:200px;"></div>
            </div>
        </main>

        <div id="monthly-list-view" class="monthly-feed-area fade-anim">
            <div class="monthly-nav-bar">
                <button class="m-nav-btn" id="m-prev-month">&lt;</button>
                <div class="m-nav-label" id="m-month-label">2025. --</div>
                <button class="m-nav-btn" id="m-next-month">&gt;</button>
            </div>
            <div id="monthly-content-box"></div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script>
        const API_URL = "https://jjrfmiwd63rogmf7ockaffndty0ddhly.lambda-url.ap-northeast-1.on.aws/";
        
        let observerLat = 35.6895; 
        let observerLon = 139.6917;
        let eventsData = {};
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        let selectedDate = null;
        let currentTab = 'daily';
        let isAnimating = false; // アニメーション中の連打防止

        // Elements
        const gridEl = document.getElementById('calendar-grid');
        const calHeaderDisplay = document.getElementById('calendar-header-display');
        const displayDateMain = document.getElementById('display-date-main');
        const displayWeekday = document.getElementById('display-weekday');
        const feedList = document.getElementById('event-feed-list');
        
        const monthlyView = document.getElementById('monthly-list-view');
        const monthlyContent = document.getElementById('monthly-content-box');
        const mMonthLabel = document.getElementById('m-month-label');
        
        const elMoonAge = document.getElementById('moon-age-val');
        const elSunRise = document.getElementById('sun-rise');
        const elSunSet = document.getElementById('sun-set');
        const elMoonRise = document.getElementById('moon-rise');
        const elMoonSet = document.getElementById('moon-set');
        const elAstroDate = document.getElementById('astro-date-display');
        const canvasMoon = document.getElementById('moon-canvas');

        const typeLabels = { meteor: "流星群", eclipse: "日食・月食", phenomenon: "天文現象", rocket: "ロケット打上", other: "その他", star: "天文現象" };
        const weekDaysEng = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function switchTab(mode) {
            if (isAnimating || mode === currentTab) return;
            isAnimating = true;

            // ハイライトのスライド移動
            const highlight = document.getElementById('tab-highlight');
            if (mode === 'monthly') {
                highlight.classList.add('move-right');
            } else {
                highlight.classList.remove('move-right');
            }

            // 文字色の切り替え（activeクラスの付け替え）
            document.querySelectorAll('.m-tab-btn').forEach(b => b.classList.remove('active'));
            const activeIndex = mode === 'daily' ? 0 : 1;
            document.querySelectorAll('.m-tab-btn')[activeIndex].classList.add('active');

            // --- コンテンツのフェード切り替え ---
            // Dailyの構成要素
            const dailyEls = [
                document.getElementById('calendar-card'),
                document.getElementById('astro-card'),
                document.getElementById('daily-heading'),
                document.getElementById('event-feed-list')
            ];
            // Monthlyの構成要素
            const monthlyEl = document.getElementById('monthly-list-view');

            // 現在表示されている要素をフェードアウト
            const visibleEls = currentTab === 'daily' ? dailyEls : [monthlyEl];
            visibleEls.forEach(el => el.classList.add('fade-out'));

            // アニメーション時間待機後に表示切り替え
            setTimeout(() => {
                const colLeft = document.getElementById('col-left');
                const colFeed = document.getElementById('col-feed');
                
                // 画面トップへスクロールリセット
                if(window.innerWidth <= 900) {
                     window.scrollTo({ top: 0 });
                }

                if (mode === 'daily') {
                    colLeft.classList.add('daily-view');
                    colFeed.classList.add('daily-view');
                    monthlyEl.classList.remove('active-view');
                    dailyEls.forEach(el => el.classList.add('fade-out')); // 初期状態は透明
                } else {
                    colLeft.classList.remove('daily-view');
                    colFeed.classList.remove('daily-view');
                    monthlyEl.classList.add('active-view');
                    renderMonthlyList();
                    monthlyEl.classList.add('fade-out'); // 初期状態は透明
                }

                // 少し待ってからフェードイン
                requestAnimationFrame(() => {
                    const newVisibleEls = mode === 'daily' ? dailyEls : [monthlyEl];
                    newVisibleEls.forEach(el => {
                        el.classList.remove('fade-out');
                    });
                    
                    currentTab = mode;
                    isAnimating = false;
                });
                
            }, 300);
        }

        async function init() {
            feedList.innerHTML = `<div class="skeleton" style="height:200px;"></div>`;
            await fetchEvents();
            
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            const todayStr = `${y}-${m}-${d}`;
            
            renderCalendar(currentYear, currentMonth);
            selectDate(todayStr);
        }

        async function fetchEvents() {
            try {
                const res = await fetch(API_URL);
                if(!res.ok) throw new Error("API Error");
                eventsData = await res.json();
            } catch(e) {
                feedList.innerHTML = `<p style="opacity:0.5;">データの読み込みに失敗しました</p>`;
            }
        }

        // --- 月変更処理 (共通) ---
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            
            renderCalendar(currentYear, currentMonth);
            if (currentTab === 'monthly') renderMonthlyList();
        }

        function renderCalendar(year, month) {
            gridEl.innerHTML = '';
            ['S','M','T','W','T','F','S'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-label'; el.textContent = d;
                gridEl.appendChild(el);
            });
            
            const label = `${year}. ${String(month + 1).padStart(2, '0')}`;
            calHeaderDisplay.textContent = label;
            mMonthLabel.textContent = label; // Monthly Navも更新
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for(let i=0; i<firstDay; i++) gridEl.appendChild(document.createElement('div'));
            for(let d=1; d<=daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                cell.textContent = d;
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                
                if (dateStr === selectedDate) cell.classList.add('selected');
                if (year===today.getFullYear() && month===today.getMonth() && d===today.getDate()) cell.classList.add('today');
                
                if (eventsData[dateStr]) {
                    const dotsContainer = document.createElement('div');
                    dotsContainer.className = 'cal-dots';
                    eventsData[dateStr].forEach(evt => {
                        const dot = document.createElement('span');
                        const typeClass = `dot-${evt.type || 'other'}`;
                        dot.className = `cal-dot ${typeClass}`;
                        dotsContainer.appendChild(dot);
                    });
                    cell.appendChild(dotsContainer);
                }

                cell.addEventListener('click', () => {
                    document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectDate(dateStr);
                    if(window.innerWidth <= 900) {
                        setTimeout(() => {
                            const heading = document.getElementById('daily-heading');
                            
                            // ▼▼▼ 修正箇所: ヘッダー+タブ分のオフセットを考慮したスクロール ▼▼▼
                            const rect = heading.getBoundingClientRect();
                            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                            
                            // ヘッダー60px + タブナビの高さ(padding込みで約60〜70px)
                            // offsetHeight で動的に取得
                            const tabNav = document.querySelector('.mobile-tab-nav');
                            const offset = 60 + (tabNav ? tabNav.offsetHeight : 60); 
                            
                            window.scrollTo({
                                top: rect.top + scrollTop - offset,
                                behavior: 'smooth'
                            });
                            // ▲▲▲ 修正終わり ▲▲▲
                        }, 100);
                    }
                });
                gridEl.appendChild(cell);
            }
        }

        function renderMonthlyList() {
            monthlyContent.innerHTML = '';
            // 月ラベル更新（念のため）
            mMonthLabel.textContent = `${currentYear}. ${String(currentMonth + 1).padStart(2, '0')}`;
            
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let hasEvent = false;

            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const events = eventsData[dateStr];
                
                if (events && events.length > 0) {
                    hasEvent = true;
                    const dateHeader = document.createElement('div');
                    dateHeader.style.cssText = "padding:1rem 0 0.5rem; color:var(--accent-gold); font-family:var(--font-tech); font-size:1.2rem; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:1rem;";
                    dateHeader.textContent = `${currentMonth+1}.${String(d).padStart(2,'0')} / ${weekDaysEng[new Date(dateStr).getDay()]}`;
                    monthlyContent.appendChild(dateHeader);

                    events.forEach(evt => {
                        const card = createEventCard(evt);
                        monthlyContent.appendChild(card);
                    });
                }
            }

            if (!hasEvent) {
                monthlyContent.innerHTML = `<div style="padding:3rem; text-align:center; opacity:0.5;">今月のイベント記録はありません</div>`;
            }
        }

        function createEventCard(evt) {
            const typeClass = `type-${evt.type || 'other'}`;
            const hasImage = !!evt.image;
            const card = document.createElement('div');
            card.className = `smart-card feed-card ${typeClass} ${hasImage ? '' : 'no-image'}`;
            
            const label = typeLabels[evt.type] || "Others";
            const typeColorVar = getComputedStyle(document.documentElement).getPropertyValue(`--col-${evt.type || 'other'}`).trim();
            const badgeStyle = `color:${typeColorVar}; border-color:${typeColorVar};`;
            const imgSection = evt.image ? `<div class="feed-img-col"><img src="${evt.image}" class="feed-img"></div>` : '';

            card.innerHTML = `
                ${imgSection}
                <div class="feed-content">
                    <div class="badge-row"><span class="smart-badge" style="${badgeStyle}">${label}</span></div>
                    <h3 class="feed-title">${evt.title}</h3>
                    <div class="feed-time"><span style="font-size:1.2rem;">⏱</span> ${evt.time}</div>
                    <div class="feed-details">
                        <p class="feed-desc">${evt.desc.replace(/\n/g, '<br>')}</p>
                    </div>
                    <div class="toggle-btn"></div>
                </div>
            `;
            card.addEventListener('click', () => card.classList.toggle('open'));
            return card;
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            const dateObj = new Date(dateStr);
            const mm = String(dateObj.getMonth()+1).padStart(2,'0');
            const dd = String(dateObj.getDate()).padStart(2,'0');
            displayDateMain.textContent = `${mm}.${dd}`;
            displayWeekday.textContent = weekDaysEng[dateObj.getDay()];
            elAstroDate.textContent = `(${mm}/${dd} Data)`;

            feedList.innerHTML = '';
            const events = eventsData[dateStr];
            if (events && events.length > 0) {
                events.forEach(evt => feedList.appendChild(createEventCard(evt)));
            } else {
                feedList.innerHTML = `<div style="padding:2rem; text-align:center; opacity:0.3; border:1px dashed #555; border-radius:12px; margin-bottom:1rem;">NO EVENT</div>`;
            }

            updateAstroData(dateObj);
        }

        function updateAstroData(dateObj) {
            if (typeof Astronomy === 'undefined') return;
            const noonDate = new Date(dateObj); noonDate.setHours(12, 0, 0, 0); 
            const phaseAngle = Astronomy.MoonPhase(noonDate); 
            const moonAge = (phaseAngle / 360) * 29.530588;
            elMoonAge.textContent = moonAge.toFixed(1);
            drawMoon(phaseAngle);

            const observer = new Astronomy.Observer(observerLat, observerLon, 0);
            const startOfDay = new Date(dateObj); startOfDay.setHours(0, 0, 0, 0);

            const sunRise = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, +1, startOfDay, 1);
            const sunSet  = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, -1, startOfDay, 1);
            elSunRise.textContent = (sunRise && isSameDate(startOfDay, sunRise.date)) ? formatTime(sunRise.date) : "--:--";
            elSunSet.textContent  = (sunSet && isSameDate(startOfDay, sunSet.date))  ? formatTime(sunSet.date)  : "--:--";

            const moonRise = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, +1, startOfDay, 1);
            const moonSet  = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, -1, startOfDay, 1);
            elMoonRise.textContent = (moonRise && isSameDate(startOfDay, moonRise.date)) ? formatTime(moonRise.date) : "--:--";
            elMoonSet.textContent  = (moonSet && isSameDate(startOfDay, moonSet.date))  ? formatTime(moonSet.date)  : "--:--";
        }

        function isSameDate(d1, d2) { return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate(); }
        function formatTime(dateObj) { return `${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`; }
        function drawMoon(phaseAngle) {
            const ctx = canvasMoon.getContext('2d');
            const w = canvasMoon.width, h = canvasMoon.height, cx = w/2, cy = h/2, r = (w/2)-2;
            ctx.clearRect(0,0,w,h); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle="#222"; ctx.fill();
            ctx.fillStyle="#eee"; ctx.beginPath();
            if (phaseAngle<=180) { ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2); ctx.ellipse(cx,cy,Math.abs(Math.cos(phaseAngle*Math.PI/180)*r),r,0,Math.PI/2,-Math.PI/2,Math.cos(phaseAngle*Math.PI/180)>0); }
            else { ctx.arc(cx,cy,r,Math.PI/2,-Math.PI/2); ctx.ellipse(cx,cy,Math.abs(Math.cos(phaseAngle*Math.PI/180)*r),r,0,-Math.PI/2,Math.PI/2,Math.cos(phaseAngle*Math.PI/180)>0); }
            ctx.fill();
        }

        // --- イベントリスナー設定 ---
        // カレンダー(Daily View)用
        document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
        document.getElementById('next-month').addEventListener('click', () => changeMonth(1));
        
        // 月間リスト(Monthly View)用
        document.getElementById('m-prev-month').addEventListener('click', () => changeMonth(-1));
        document.getElementById('m-next-month').addEventListener('click', () => changeMonth(1));

        document.getElementById('btn-geo').addEventListener('click', () => {
            if(!navigator.geolocation) return alert("Geolocation error");
            document.getElementById('btn-geo').textContent="...";
            navigator.geolocation.getCurrentPosition(p=>{
                observerLat=p.coords.latitude; observerLon=p.coords.longitude;
                document.getElementById('geo-display').textContent=`📍 N${observerLat.toFixed(1)} / E${observerLon.toFixed(1)}`;
                document.getElementById('btn-geo').textContent="更新";
                if(selectedDate) updateAstroData(new Date(selectedDate));
            });
        });

        init();
    </script>
</body>
</html>
